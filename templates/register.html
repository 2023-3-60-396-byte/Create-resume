{% extends "base.html" %}{% block content %}
{% macro err(k) %}{% if errors.get(k) %}<small class="err">{{ errors[k] }}</small>{% endif %}{% endmacro %}
<form class="paper auth" method="post"><h1>Register</h1>
<label>Full name<input name="name" required minlength="2" maxlength="100" value="{{ f.name }}">{{ err('name') }}</label>
<label>Email<input name="email" type="email" required maxlength="254" value="{{ f.email }}">{{ err('email') }}</label>
<label>Phone<input name="phone" type="tel" required maxlength="20" value="{{ f.phone }}">{{ err('phone') }}</label>
<label>Password (min 8 characters)<input name="password" type="password" required minlength="8" maxlength="128">{{ err('password') }}</label>
<label>Confirm password<input name="confirm" type="password" required maxlength="128">{{ err('confirm') }}</label>
<button class="btn">Create account</button> <a href="{{ url_for('login') }}">I have an account</a></form>{% endblock %}
