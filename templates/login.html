{% extends "base.html" %}{% block content %}
<form class="paper auth" method="post"><h1>Login</h1>
<input type="hidden" name="next" value="{{ next or '' }}">
<label>Email<input name="email" type="email" value="{{ email or '' }}" required></label>
<label>Password<input name="password" type="password" required></label>
{% if error %}<small class="err">{{ error }}</small>{% endif %}
<button class="btn">Login</button> <a href="{{ url_for('register') }}">Create an account</a></form>{% endblock %}
